
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FitTrack Pro | Gym Management & Fitness Tracking</title>
    <meta name="description" content="Next-generation gym management, workout logging, session booking, and fitness progress tracking platform." />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitTrack Pro" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FitTrack Pro | Gym Management & Fitness Tracking" />
    <meta property="og:description" content="Next-generation gym management, workout logging, session booking, and fitness progress tracking." />
    <meta property="og:site_name" content="FitTrack Pro" />
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('fittrack_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark) || stored === 'system' && prefersDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else if (stored === 'light' || (stored === 'system' && !prefersDark)) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body class="bg-background text-foreground antialiased min-h-screen selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
